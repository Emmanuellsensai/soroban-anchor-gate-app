name: Dependabot Auto-Merge

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot-review:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Approve and auto-merge safe Patch/Minor updates
        # Only auto-approve safe patch or minor updates, NEVER major version bumps
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: |
          echo "Approving Dependabot PR: $PR_URL"
          gh pr review --approve "$PR_URL"
          echo "Enabling auto-merge for Dependabot PR..."
          gh pr merge --auto --squash "$PR_URL" || gh pr merge --squash "$PR_URL" || echo "Auto-merge queued or waiting on CI checks."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Flag Major dependency updates for manual review
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: |
          gh pr comment "$PR_URL" --body "⚠️ **Major dependency update detected.** Auto-merge skipped to prevent breaking changes. Maintainer review required (@emarkees)."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
